name: Build & Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test games and enrolment demo
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate and build static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          site = Path('_site')
          site.mkdir(exist_ok=True)
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html lang="zh-Hant">' in html
          assert Path('dashboard.html').read_text(encoding='utf-8').count('class="slide') == 12
          assert html.rstrip().endswith('</html>')
          for name in ['index.html', 'dashboard.html', 'todo.html', 'education.html', 'kids-game.html', 'kids-engine.js', 'course-ai.html', 'course-python.html', 'course-primary.html', 'course-art.html', 'course-style.css', 'enrolment.html', 'admin.html', 'application.html', 'enrolment-data.js', 'enrolment-ui.js', 'enrolment-style.css']:
              shutil.copyfile(name, site / name)
          shutil.copytree('education-assets', site / 'education-assets', dirs_exist_ok=True)
          (site / '.nojekyll').touch()
          print('Validated presentation and built static site.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
