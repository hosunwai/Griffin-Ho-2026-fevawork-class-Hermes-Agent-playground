<section id="menu" aria-labelledby="welcome"><div class="intro"><div><p class="eyebrow">5–8 歲 · 一起玩，一起學</p><h1 id="welcome" tabindex="-1">今天想挑戰甚麼？</h1><p>不用趕時間，選一個喜歡的遊戲開始吧！</p></div><svg class="buddy" viewBox="0 0 140 140" aria-hidden="true"><path d="m70 0 10 21 21-12 2 24 25-1-10 23 22 15-22 15 10 23-25-1-2 24-21-12-10 21-10-21-21 12-2-24-25 1 10-23L0 70l22-15-10-23 25 1 2-24 21 12z" fill="#f2c95b"/><circle cx="70" cy="70" r="43" fill="#ffe49a"/><circle cx="55" cy="65" r="4" fill="#5c482d"/><circle cx="85" cy="65" r="4" fill="#5c482d"/><path d="M55 83q15 16 30 0" fill="none" stroke="#5c482d" stroke-width="4" stroke-linecap="round"/></svg></div>

<div class="rules"><span>每局 10 題</span><span>答對加 10 分，答錯不扣分</span><span>沒有計時，慢慢想</span></div><p class="privacy">不用登入，不收集小朋友的姓名或答案；重新整理後重新開始。</p></section>
<section id="game" hidden aria-label="遊戲答題區"><div class="game-head"><div><span class="mode-label" id="modeLabel"></span><button class="switch" id="switchMode">重新選模式</button></div><div class="scoreline"><span id="roundLabel"></span><span class="score" aria-live="polite">★ <span id="score">0</span> 分</span></div></div><div class="progress" role="progressbar" aria-label="已完成題目" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="progressFill"></div></div>

</main><footer>課堂示範遊戲 · Johnny Education Centre<br>與家長一起玩，學習更開心。</footer>

function hideAll(){['menu','game','result'].forEach(id=>$(id).hidden=true)}
function menu(){game=null;hideAll();$('menu').hidden=false;$('welcome').focus()}
function start(mode){game=KidsEngine.createGame(mode);hideAll();$('game').hidden=false;$('modeLabel').textContent=mode==='english'?'英文生字探險':'數學小高手';render()}
function render(){const q=game.question;selected=null;$('board').classList.remove('pop','wiggle');$('sparkles').replaceChildren();$('feedback').className='feedback';$('feedback').textContent='選一個答案，勇敢試試吧！';$('roundLabel').textContent='第 '+(game.index+1)+'／10 題';$('score').textContent=game.score;updateProgress(game.index);$('next').disabled=true;$('next').textContent=game.index===9?'看看成績 ★':'下一題 →';$('prompt').textContent=game.mode==='english'?'圖片裡的是甚麼？':'算一算，答案是多少？';$('questionNote').textContent=game.mode==='english'?'選出正確的英文生字':'答案在 0–20 之間，不用急。';if(game.mode==='english'){$('visual').innerHTML='<svg class="picture" viewBox="0 0 220 200" role="img" aria-label="'+q.zh+'的卡通圖畫">'+art[q.picture]+'</svg>'}else{$('visual').replaceChildren();const eq=document.createElement('div');eq.className='equation';eq.textContent=q.a+' '+q.op+' '+q.b+' = ?';$('visual').append(eq)}$('answers').replaceChildren();q.choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='answer';if(game.mode==='english')b.lang='en';const k=document.createElement('span');k.className='key';k.textContent=i+1;k.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=choice;b.append(k,label);b.onclick=()=>answer(choice);$('answers').append(b)});$('prompt').focus()}
function updateProgress(n){$('progressFill').style.width=n*10+'%';document.querySelector('.progress').setAttribute('aria-valuenow',n)}
function answer(choice){if(!game||!game.submit(choice))return;selected=choice;const q=game.question,correct=choice===q.answer;$('score').textContent=game.score;updateProgress(game.index+1);[...$('answers').children].forEach((b,i)=>{b.disabled=true;const v=q.choices[i];if(v===q.answer){b.classList.add('right');b.append(mark('✓'));b.setAttribute('aria-label',String(v)+'，正確答案')}else if(v===choice){b.classList.add('wrong');b.append(mark('↻'));b.setAttribute('aria-label',String(v)+'，再練習一下')}});$('feedback').className='feedback '+(correct?'good':'try');const solution=game.mode==='english'?q.zh+'是 '+q.answer:q.a+' '+q.op+' '+q.b+' = '+q.answer;$('feedback').textContent=correct?'答對了！＋10 分。'+solution:'很好的嘗試！正確答案：'+solution+'。';$('board').classList.add(correct?'pop':'wiggle');if(correct)for(let i=0;i<12;i++){const dot=document.createElement('i');const a=i*Math.PI/6;dot.style.setProperty('--x',Math.round(Math.cos(a)*140)+'px');dot.style.setProperty('--y',Math.round(Math.sin(a)*85)+'px');$('sparkles').append(dot)}$('next').disabled=false;$('next').focus()}
function mark(text){const m=document.createElement('span');m.className='mark';m.setAttribute('aria-hidden','true');m.textContent=text;return m}
function next(){if(!game||!game.next())return;if(!game.finished){render();return}hideAll();$('result').hidden=false;$('finalScore').textContent=game.score;$('resultMode').textContent=(game.mode==='english'?'英文生字':'數學加減')+' · 完成 10 題';$('resultMessage').textContent='你答對了 '+game.correct+' 題，完成整個挑戰！';$('resultTitle').focus()}
$('englishMode').onclick=()=>start('english');$('mathMode').onclick=()=>start('math');$('switchMode').onclick=menu;$('chooseMode').onclick=menu;$('again').onclick=()=>start(game.mode);$('next').onclick=next;
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||!game||game.finished||game.answered)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();answer(game.question.choices[Number(e.key)-1])}});
})();
</script>
</body>
</html>
